# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: develop-cicd
# If this pipeline fails due to external service flakiness and you need to deply anyway,
# use the force-deploy workflow manually via Actions tab. Never modify this file to skip tests permanently
on:
  push:
    branches:
      - develop
  
  pull_request:
      branches:
        - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AppSettings__UserId: ${{secrets.RANDOM_USER_ID}}
      AppSettings__CW1Settings__Password: ${{secrets.CW1_EADAPTOR_PASSWORD}}

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      - name: Run tests
        run: dotnet test --no-build 
            --configuration Release 
            --logger "trx;LogFileName=test-results.trx" 
            --collect:"XPlat Code Coverage"
            --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Integration Tests'
          path: 'TestResults/*.trx'
          reporter: dotnet-trx

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run:
          reportgenerator
            -reports:"./TestResults/**/coverage.cobertura.xml"
            -targetdir:"./CoverageReport"
            -reporttypes:"HtmlInline;Cobertura;MarkdownSummaryGithub"

      - name: Write Coverage to Job Summary
        run: cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./CoverageReport

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: dotnet publish ./API/API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-mvt-sdet-poc-develop'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3D02C3430C474F54A09C56C156DFC434 }}